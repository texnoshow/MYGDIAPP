name: Build GDI App x86

on:
  # 1. Защита: Разрешаем запуск сборки вручную через вкладку Actions
  workflow_dispatch:

  # 2. Защита: Авто-сборка только при реальном изменении кода в ветке main
  push:
    branches: [ "main" ]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.hpp'
      - 'CMakeLists.txt'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.hpp'
      - 'CMakeLists.txt'

jobs:
  build:
    name: Build Windows x86 Application
    runs-on: windows-latest
    
    # 3. Защита: Полностью блокируем запуск сборки, если коммит сделан автоматическим ботом
    if: |
      github.actor != 'dependabot[bot]' && 
      github.actor != 'github-actions[bot]' && 
      github.actor != 'actions-user'

    steps:
    # Шаг 1: Клонирование репозитория
    - name: Checkout repository
      uses: actions/checkout@v4

    # Шаг 2: Настройка окружения Developer Command Prompt под архитектуру x86
    - name: Configure Developer Command Prompt for MSVC (x86)
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    # Шаг 3: Компиляция C++ приложения с GDI-библиотеками (архитектура x86)
    # Флаг /SUBSYSTEM:WINDOWS скрывает консольное окно. 
    # Убедитесь, что ваш файл в корне репозитория называется main.cpp
    - name: Compile GDI Application
      run: |
        cl.exe /EHsc /O2 main.cpp /link /SUBSYSTEM:WINDOWS gdi32.lib user32.lib /OUT:GdiEffectsApp_x86.exe

    # Шаг 4: Выгрузка готового 32-битного .exe файла в артефакты GitHub
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: gdi-effects-x86-executable
        path: GdiEffectsApp_x86.exe
        retention-days: 7  # Файл автоматически удалится через 7 дней для экономии места
